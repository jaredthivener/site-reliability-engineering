<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SRE Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2fa;
  --surface:#ffffff;
  --ink:#080f1e;
  --muted:#5a6880;
  --line:rgba(8,15,30,0.09);
  --blue:#1d4ed8;
  --blue-dim:rgba(29,78,216,0.08);
  --blue-border:rgba(29,78,216,0.20);
  --sky:#0ea5e9;
  --green:#059669;
  --red:#dc2626;
  --amber:#d97706;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --r:18px;
  --r-sm:12px;
  --sh:0 14px 44px rgba(8,15,30,0.08);
  --sh-sm:0 4px 16px rgba(8,15,30,0.06);
}
html,body{height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink)}
body{
  background:
    radial-gradient(ellipse at 86% 4%,rgba(29,78,216,0.12),transparent 32%),
    radial-gradient(ellipse at 7% 92%,rgba(14,165,233,0.10),transparent 28%),
    var(--bg);
}
#app{display:grid;grid-template-columns:288px 1fr;height:100%}
#printAll{display:none}
#notesDrawer{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-top:1px solid var(--line);
  padding:12px 24px 16px;box-shadow:0 -10px 30px rgba(8,15,30,0.12);
  max-height:26vh;overflow-y:auto;
}
#notesLabel{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
#notesContent{font-size:.88rem;line-height:1.55;color:var(--ink);max-width:900px}

/* sidebar */
#sidebar{
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;
  padding:20px 14px;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px}
.bmark{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
  box-shadow:0 8px 22px rgba(29,78,216,0.30);
  display:grid;place-items:center;color:#fff;
  font-family:var(--mono);font-weight:700;font-size:1rem;
}
.btxt{font-weight:800;font-size:.87rem;line-height:1.25}
.bsub{font-size:.70rem;color:var(--muted);margin-top:1px}
hr.div{border:none;border-top:1px solid var(--line)}
#navlist{overflow-y:auto;flex:1;padding-right:2px}
.ni{
  cursor:pointer;padding:8px 10px;border-radius:9px;
  border:1px solid transparent;
  transition:background .13s,border-color .13s,transform .13s;
  margin-bottom:3px;
}
.ni:hover{background:rgba(29,78,216,0.05);border-color:var(--blue-border);transform:translateX(2px)}
.ni.on{background:var(--blue-dim);border-color:var(--blue-border)}
.ns{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--blue);letter-spacing:.10em;text-transform:uppercase}
.nt{font-size:.78rem;font-weight:600;line-height:1.3;color:var(--ink);margin-top:2px}
.ni.on .nt{font-weight:800}
.kbhint{font-size:.68rem;color:var(--muted);font-family:var(--mono)}

/* canvas */
#canvas{display:flex;flex-direction:column;padding:20px 20px 16px;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:12px;flex-shrink:0}
.dlabel{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.dtitle{font-weight:800;font-size:1.02rem;margin-top:1px}
.tright{display:flex;align-items:center;gap:10px}
.schip{
  font-family:var(--mono);font-size:.68rem;font-weight:700;
  color:var(--blue);border:1px solid var(--blue-border);
  background:var(--blue-dim);border-radius:999px;padding:4px 11px;
}
.scount{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-weight:600}
#prog{height:5px;border-radius:999px;background:rgba(29,78,216,0.12);margin-bottom:12px;flex-shrink:0;overflow:hidden}
#progbar{height:100%;border-radius:999px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);transition:width .28s ease}
#frame{flex:1;overflow-y:auto;padding-right:5px}
#panel{
  height:calc(100vh - 124px);
  background:rgba(255,255,255,0.90);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--sh);
  padding:34px 36px;
  position:relative;overflow:hidden;
}
#panel::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(29,78,216,0.025),transparent 40%,rgba(14,165,233,0.025));
}
#fbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-shrink:0}
#fbar span{font-family:var(--mono);font-size:.68rem;color:var(--muted)}

/* buttons */
.btn{
  border:none;cursor:pointer;border-radius:9px;font-family:var(--sans);
  font-weight:700;font-size:.80rem;padding:7px 15px;transition:all .13s;
}
.btn-o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-o:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.btn-s{background:var(--blue);color:#fff;border:1.5px solid var(--blue)}
.btn-s:hover:not(:disabled){background:#1e40af}
.btn:disabled{opacity:.35;cursor:default}
.nbts{display:flex;gap:8px}

/* slide content */
.kicker{font-family:var(--mono);font-size:.63rem;font-weight:700;color:var(--blue);letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}
.stitle{font-size:clamp(1.65rem,3vw,2.55rem);font-weight:800;letter-spacing:-.04em;line-height:1.12;margin-bottom:9px}
.ssub{font-size:.95rem;color:var(--muted);line-height:1.68;max-width:860px}
.sdiv{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:16px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-sm);padding:16px 18px;height:100%}
.ctitle{font-weight:800;font-size:.90rem;margin-bottom:8px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.hgrid{display:grid;grid-template-columns:1.3fr 0.9fr;gap:18px;align-items:start}

.blist{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.bitem{display:flex;gap:9px;align-items:flex-start;font-size:.89rem;line-height:1.55}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:.48em}

.chip{display:inline-block;font-family:var(--mono);font-size:.70rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--blue-border);color:var(--blue);background:var(--blue-dim);margin-top:7px}
.chip.r{border-color:rgba(220,38,38,.25);color:var(--red);background:rgba(220,38,38,.07)}
.chip.a{border-color:rgba(217,119,6,.25);color:var(--amber);background:rgba(217,119,6,.07)}
.chip.g{border-color:rgba(5,150,105,.25);color:var(--green);background:rgba(5,150,105,.07)}

.bignum{font-family:var(--mono);font-size:1.75rem;font-weight:700;color:var(--blue);line-height:1.1;margin:6px 0 4px}
.formula{background:var(--blue-dim);border:1px solid var(--blue-border);border-radius:9px;padding:11px 13px;margin-bottom:9px}
.formula .fl{font-weight:800;font-size:.88rem}
.formula .fv{font-size:.83rem;color:var(--muted);margin-top:2px}

.fmla-hero{background:var(--blue-dim);border:2px solid var(--blue-border);border-radius:10px;padding:18px 24px;display:flex;flex-direction:column;gap:6px}
.fmla-eq{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--blue);letter-spacing:.02em}
.fmla-sub{font-size:.82rem;color:var(--muted);font-style:italic}
.step-tbl{width:100%;border-collapse:collapse}
.step-tbl tr td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.step-tbl tr:last-child td{border-bottom:none}
.step-tbl td.slbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-right:16px;white-space:nowrap;width:1%;padding-top:9px}
.step-tbl td.seq{font-family:var(--mono);font-size:.87rem;line-height:1.5}
.step-tbl td.seq b{color:var(--blue)}
.nines-tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.nines-tbl th{text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.nines-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.nines-tbl td:first-child{font-weight:700;color:var(--blue)}
.nines-tbl tr:last-child td{border-bottom:none}
.nines-tbl tr.nhl td{background:rgba(29,78,216,0.07)}

.loop-flow{display:flex;align-items:stretch;gap:0}
.loop-step{flex:1;background:var(--blue-dim);border:1px solid var(--blue-border);border-radius:9px;padding:14px 16px}
.loop-num{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--blue);opacity:.55;letter-spacing:.08em;margin-bottom:5px}
.loop-label{font-weight:800;font-size:1rem;margin-bottom:5px}
.loop-desc{font-size:.80rem;color:var(--muted);line-height:1.45}
.loop-arr{align-self:center;color:var(--blue);font-size:1.4rem;flex-shrink:0;padding:0 8px;opacity:.4;font-weight:700}
.analogy-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.br-tier{padding:13px 15px;border-radius:9px;margin-bottom:11px}
.br-tier:last-child{margin-bottom:0}
.br-tier.r{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.22)}
.br-tier.a{background:rgba(217,119,6,.06);border:1px solid rgba(217,119,6,.22)}
.br-tier.g{background:rgba(5,150,105,.06);border:1px solid rgba(5,150,105,.22)}
.br-head{display:flex;align-items:baseline;gap:11px;margin-bottom:4px}
.br-mult{font-family:var(--mono);font-size:1.55rem;font-weight:700;line-height:1}
.br-mult.r{color:var(--red)}
.br-mult.a{color:var(--amber)}
.br-mult.g{color:var(--green)}
.br-name{font-weight:800;font-size:.90rem}
.br-meta{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.br-body{font-size:.83rem;line-height:1.52;color:var(--muted)}
.br-body b{color:var(--ink);font-weight:700}
.br-example{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:5px;padding:5px 8px;background:rgba(0,0,0,.03);border-radius:5px}
.analogy-row:last-child{border-bottom:none}
.analogy-concept{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:90px;flex-shrink:0}
.analogy-val{font-size:.85rem;line-height:1.45}
.analogy-val b{color:var(--blue)}

.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{background:rgba(29,78,216,0.06);padding:9px 13px;text-align:left;font-weight:800;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 13px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover{background:rgba(29,78,216,0.025)}
.tbl td:first-child{font-weight:700}
.twrap{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}

.callout{background:var(--blue-dim);border-left:3px solid var(--blue);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:13px 16px;font-weight:700;font-size:.90rem;line-height:1.55}
.note{background:rgba(5,150,105,.06);border-left:3px solid var(--green);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:11px 16px;font-size:.86rem;line-height:1.55;color:#065f46}

.reflink{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:13px 16px;margin-bottom:7px;
  box-shadow:var(--sh-sm);transition:box-shadow .14s,border-color .14s;
}
.reflink:hover{box-shadow:0 14px 38px rgba(29,78,216,0.12);border-color:var(--blue-border)}
.rtitle{font-weight:800;font-size:.88rem}
.rurl{font-family:var(--mono);font-size:.69rem;color:var(--muted);margin-top:2px}

.tprop{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-sm)}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:.45em}
.tlabel{font-weight:800;font-size:.86rem;margin-bottom:3px}
.tdesc{font-size:.82rem;color:var(--muted);line-height:1.5}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.sigicon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1rem;margin-bottom:9px}
.sname{font-weight:800;font-size:.92rem;margin-bottom:5px}
.sdesc{font-size:.84rem;color:var(--muted);line-height:1.52;margin-bottom:9px}

/* dark mode */
body.dark{
  --bg:#0d1117;
  --surface:#161b27;
  --ink:#e2e8f5;
  --muted:#7a8aaa;
  --line:rgba(226,232,245,0.08);
  --blue:#4f84f8;
  --blue-dim:rgba(79,132,248,0.12);
  --blue-border:rgba(79,132,248,0.28);
  --green:#34d399;
  --red:#f87171;
  --amber:#fbbf24;
  --sh:0 14px 44px rgba(0,0,0,0.35);
  --sh-sm:0 4px 16px rgba(0,0,0,0.25);
}
body.dark{
  background:
    radial-gradient(ellipse at 86% 4%,rgba(79,132,248,0.10),transparent 32%),
    radial-gradient(ellipse at 7% 92%,rgba(14,165,233,0.07),transparent 28%),
    var(--bg);
}
body.dark #sidebar{background:rgba(18,23,36,0.88)}
body.dark #panel{background:rgba(22,27,39,0.96)}
body.dark .card{background:var(--surface)}
body.dark .tprop{background:var(--surface)}
body.dark .reflink{background:var(--surface)}
body.dark .note{background:rgba(52,211,153,0.07);color:#6ee7b7}
body.dark .tbl th{background:rgba(79,132,248,0.10)}
body.dark .btn-o{border-color:var(--line);color:var(--ink)}
body.dark .btn-o:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}

/* transition everything smoothly */
body,#sidebar,#panel,.card,.tprop,.reflink,.note,.tbl th,.btn-o,
#app,.callout,.formula,.chip{transition:background .22s,color .22s,border-color .22s,box-shadow .22s}

/* toggle switch */
.dm-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.dm-label{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--muted);transition:color .22s}
.toggle-track{
  width:38px;height:22px;border-radius:999px;
  background:rgba(29,78,216,0.15);border:1.5px solid var(--blue-border);
  position:relative;transition:background .22s,border-color .22s;cursor:pointer;
}
body.dark .toggle-track{background:rgba(79,132,248,0.25)}
.toggle-thumb{
  position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#1d4ed8;
  transition:transform .22s cubic-bezier(.4,0,.2,1),background .22s;
  display:grid;place-items:center;font-size:.6rem;
}
body.dark .toggle-thumb{transform:translateX(16px);background:#4f84f8}

@media(max-width:1080px){
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  body,html{overflow:auto;height:auto}
  #canvas{padding:12px}
  #frame{overflow:visible;flex:none}
  #panel{height:auto;padding:20px}
  .hgrid,.g2,.g3,.g4{grid-template-columns:1fr}
  #topbar{position:relative;z-index:60;background:var(--bg);padding-bottom:4px}
  #app.mobilenav-open #sidebar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    top:104px;width:100%;padding:16px;
    background:var(--bg);
  }
}

/* sidebar collapse */
#app.collapsed{grid-template-columns:0 1fr}
#app.collapsed #sidebar{width:0;padding:0;overflow:hidden;border:none}
.collapse-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:none;border:none;cursor:pointer;font-size:1rem;color:var(--muted);
  transition:color .13s;
}
.collapse-btn:hover{color:var(--blue)}
#sidebar-toggle{
  border:none;cursor:pointer;background:transparent;
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  font-size:.85rem;color:var(--muted);transition:background .13s,color .13s;
  flex-shrink:0;
}
#sidebar-toggle:hover{background:var(--blue-dim);color:var(--blue)}

/* fullscreen button */
.btn-icon{
  border:none;cursor:pointer;border-radius:9px;font-family:var(--sans);
  font-weight:700;font-size:.80rem;padding:7px 10px;transition:all .13s;
  background:transparent;border:1.5px solid var(--line);color:var(--muted);
}
.btn-icon:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}

/* slide fade transition */
#panel{transition:opacity .15s ease,background .22s,color .22s,border-color .22s,box-shadow .22s}
#panel.fade-out{opacity:0}

@media print{
  *{overflow:visible!important}
  #app{display:none!important}
  #printAll{display:block!important}
  body,html{height:auto;overflow:visible}
  .panel-print{border:none;box-shadow:none;border-radius:0;padding:24px 28px;page-break-after:always}
  .panel-print:last-child{page-break-after:auto}
  .hgrid,.g2,.g3,.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="bmark">S</div>
      <div><div class="btxt">SRE Fundamentals</div><div class="bsub">Principal Engineer Edition</div></div>
    </div>
    <hr class="div"/>
    <div id="navlist"></div>
    <hr class="div"/>
    <div class="kbhint">&larr; &rarr; navigate &middot; F fullscreen &middot; N notes</div>
  </aside>
  <main id="canvas">
    <div id="topbar">
      <div><div class="dlabel">Principal Engineer · Internal Training Deck</div><div class="dtitle">SRE Fundamentals</div></div>
      <div class="tright">
        <span class="schip" id="schip"></span>
        <span class="scount" id="scount"></span>
        <button class="btn-icon" id="fsbtn" title="Fullscreen (F)">⛶</button>
        <button class="btn-icon" id="sidebartoggle" title="Toggle sidebar">☰</button>
        <div class="dm-toggle" id="dmtoggle" title="Toggle dark mode">
          <span class="dm-label" id="dmlabel">LIGHT</span>
          <div class="toggle-track"><div class="toggle-thumb" id="dmthumb">☀️</div></div>
        </div>
      </div>
    </div>
    <div id="prog"><div id="progbar"></div></div>
    <div id="frame"><div id="panel"></div></div>
    <div id="fbar">
      <div class="nbts">
        <button class="btn btn-o" id="bprev">← Prev</button>
        <button class="btn btn-s" id="bnext">Next →</button>
      </div>
    </div>
  </main>
</div>
<div id="printAll" aria-hidden="true"></div>
<div id="notesDrawer" hidden>
  <div id="notesLabel">SPEAKER NOTES <span style="font-weight:400;opacity:.7">— press N to close</span></div>
  <div id="notesContent"></div>
</div>
<script>
function dot(c){return'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--'+c+');margin-right:7px;vertical-align:middle"></span>';}
var ICON_PATHS={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  broadcast:'<circle cx="12" cy="14" r="2"/><path d="M8.5 9a5 5 0 000 6"/><path d="M15.5 9a5 5 0 010 6"/><path d="M5.3 6a9 9 0 000 12"/><path d="M18.7 6a9 9 0 010 12"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v6"/><path d="M12 16.3h.01"/>',
  bars:'<path d="M4 20V13"/><path d="M10.5 20V6"/><path d="M17 20v-9"/>',
  check:'<path d="M4 12.5l4.5 4.5L20 6"/>',
  cross:'<path d="M6 6l12 12"/><path d="M18 6L6 18"/>'
};
function svgIcon(name,color,size){
  size=size||18;
  return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">'+ICON_PATHS[name]+'</svg>';
}
// error budget burn-down: sustainable rate vs. a 2x burn exhausting the budget by day 15
function chartBurndown(){
  return'<svg viewBox="0 0 600 190" style="width:100%;height:auto" role="img" aria-label="Error budget burn-down chart: sustainable rate versus a 2x burn exhausting the budget by day 15">'+
    '<style>.cbd-ax{stroke:var(--line);stroke-width:1}.cbd-s{stroke:var(--blue);stroke-width:2.5;fill:none}.cbd-b{stroke:var(--red);stroke-width:2.5;fill:none}.cbd-l{font:600 11px var(--mono);fill:var(--muted)}</style>'+
    '<line class="cbd-ax" x1="50" y1="10" x2="50" y2="150"/>'+
    '<line class="cbd-ax" x1="50" y1="150" x2="580" y2="150"/>'+
    '<line class="cbd-s" x1="50" y1="10" x2="580" y2="150"/>'+
    '<line class="cbd-b" x1="50" y1="10" x2="315" y2="150"/>'+
    '<line class="cbd-b" x1="315" y1="150" x2="580" y2="150" stroke-dasharray="4 4"/>'+
    '<circle cx="315" cy="150" r="4" fill="var(--red)"/>'+
    '<text class="cbd-l" x="315" y="168" text-anchor="middle">Day 15: budget gone</text>'+
    '<text class="cbd-l" x="50" y="168" text-anchor="start">Day 0</text>'+
    '<text class="cbd-l" x="580" y="168" text-anchor="end">Day 30</text>'+
    '<text class="cbd-l" x="42" y="14" text-anchor="end">100%</text>'+
    '<text class="cbd-l" x="42" y="154" text-anchor="end">0%</text>'+
    '<text class="cbd-l" x="560" y="28" text-anchor="end" style="fill:var(--blue)">Sustainable (1&times;)</text>'+
    '<text class="cbd-l" x="330" y="110" style="fill:var(--red)">Actual burn (2&times;)</text>'+
  '</svg>';
}
// time-to-exhaustion bars, same figures as the burn-rate table above them
function chartExhaustionBars(){
  var rows=[
    {label:'14.4&times;',days:50/24,vlab:'~50 h',color:'var(--red)'},
    {label:'6&times;',days:5,vlab:'5 days',color:'var(--amber)'},
    {label:'3&times;',days:10,vlab:'10 days',color:'var(--blue)'},
    {label:'2&times;',days:15,vlab:'15 days',color:'var(--blue)'},
    {label:'1&times;',days:30,vlab:'30 days (miss)',color:'var(--green)'}
  ];
  var max=30,rowH=30;
  var bars=rows.map(function(r,i){
    var y=i*rowH+6,w=(r.days/max)*250;
    return'<text x="0" y="'+(y+15)+'" class="ceb-l" text-anchor="start">'+r.label+'</text>'+
      '<rect x="56" y="'+y+'" width="'+w+'" height="18" rx="4" fill="'+r.color+'" opacity="0.85"/>'+
      '<text x="'+(64+w)+'" y="'+(y+14)+'" class="ceb-v">'+r.vlab+'</text>';
  }).join('');
  return'<svg viewBox="0 0 460 156" style="width:100%;height:auto" role="img" aria-label="Time to exhaust the error budget at each burn rate — shortest bar is most urgent">'+
    '<style>.ceb-l{font:700 12px var(--mono);fill:var(--ink)}.ceb-v{font:600 11px var(--mono);fill:var(--muted)}</style>'+
    bars+
  '</svg>';
}
// illustrative relative engineering effort per nine — not measured data, see caption/source
function chartCostCurve(){
  var vals=[1,2,4,10,40],labels=['99%','99.9%','99.95%','99.99%','99.999%'],max=40;
  var bars=vals.map(function(v,i){
    var x=i*94+30,h=(v/max)*120,y=150-h;
    return'<rect x="'+x+'" y="'+y+'" width="48" height="'+h+'" rx="4" fill="var(--blue)" opacity="'+(0.4+i*0.14).toFixed(2)+'"/>'+
      '<text x="'+(x+24)+'" y="166" text-anchor="middle" class="ccc-l">'+labels[i]+'</text>'+
      '<text x="'+(x+24)+'" y="'+(y-7)+'" text-anchor="middle" class="ccc-v">'+v+'&times;</text>';
  }).join('');
  return'<svg viewBox="0 0 500 180" style="width:100%;height:auto" role="img" aria-label="Illustrative relative engineering effort rising sharply with each additional nine of reliability">'+
    '<style>.ccc-l{font:700 11px var(--mono);fill:var(--muted)}.ccc-v{font:700 12px var(--mono);fill:var(--blue)}</style>'+
    bars+
  '</svg>';
}

{section:'SRE Model',type:'columns',

{section:'Terminology',type:'cards',

   {name:'SLI',desc:'A quantitative measure of a service level. The ratio of good events to total events over a rolling window.',chip:'good_requests / total_requests',cs:''},
   {name:'SLO',desc:'A target value for an SLI. The reliability promise made to stakeholders.',chip:'99.9% success over 30 days',cs:''},

{section:'Four Golden Signals',type:'golden',

{section:'Critical User Journeys',type:'twopane',
 title:'Define SLIs around Critical User Journeys',
 notes:"Push back if someone says we already have SLIs — ask whether those SLIs map to a CUJ a real user experiences, or just an endpoint that was easy to instrument.",
 subtitle:'A CUJ is the sequence of actions a user takes to accomplish a goal. SLIs should cover the whole journey, not just a single endpoint.',
 left:{title:'How to identify CUJs',bullets:['Map what users actually do — not what the system exposes','Identify where user pain translates to business impact','Start with login/auth, primary write, and core read paths','Validate with support tickets and NPS/CSAT data','Pick 3–5 CUJs that cover ~80% of user value']},
 right:{title:'Example CUJs for a SaaS platform',bullets:['Sign in → reach the dashboard (auth CUJ)','Create and submit a report (write CUJ)','Load and view a dashboard (read CUJ)','Receive and process a webhook (async CUJ)','Export data to CSV / PDF (egress CUJ)']},
 note:'Each CUJ gets its own SLI and SLO. This forces full journey instrumentation, not just outermost load-balancer metrics. In multi-tenant SaaS, measure CUJs per cohort (tier, region, or tenant) — aggregate SLIs can mask one tenant\'s severe degradation inside a healthy average.'},

{section:'SLI Specification',type:'twopane',
 title:'Specification and implementation are different decisions',
 notes:"This is the slide that prevents a costly rebuild later — a team that skips the specification step often re-implements its SLI from scratch when logs and RUM disagree.",
 subtitle:'One SLI has two layers: what you promise to measure, and how you actually measure it. Confusing them is the most common SLI failure.',
 left:{title:'Specification vs. implementation',bullets:[
   'Specification: the outcome that matters to users, independent of how it\'s measured — e.g. "home page requests load in under 100 ms"',
   'Implementation: the specification plus a concrete measurement method — server access logs, browser-side RUM, or a synthetic probe',
   'The same specification measured three ways gives three different numbers — each trading off coverage, accuracy, and cost differently',
   'One specification can have multiple valid implementations; choosing one is a measurement-boundary decision, not a math problem',
   'Document the specification and implementation separately — implementations change as instrumentation improves; the specification should not'
 ]},
 right:{title:'SLI categories by service type',bullets:[
   '<b>Request-driven services</b> (APIs, web apps): Availability, Latency, Quality',
   '<b>Pipeline / data-processing services</b> (batch, streaming, ETL): Freshness, Correctness, Coverage',
   '<b>Storage systems</b>: Durability',
   'Pick categories that match your service type first — an availability SLI on a batch pipeline measures the wrong thing',
   'Most SaaS platforms are a mix: request-driven APIs plus async pipelines, each needing their own SLI category'
 ]},
 note:'Source: Google SRE Workbook, Chapter 2 — Implementing SLOs. <a href="https://sre.google/workbook/implementing-slos/" target="_blank" rel="noreferrer">sre.google/workbook/implementing-slos</a>'},

{section:'SLI Design',type:'twopane',
 title:'How to design the right SLI',
 notes:"Have the room name one metric they currently alert on that belongs in the avoid column — it's almost always pod restart count or CPU.",
 subtitle:'Choose indicators that are precise, automatable, and tied to customer impact.',
 left:{title:'Good SLIs are…',bullets:['User-centric: maps to something a user feels','Countable: a ratio of good events to total events','Windowed: evaluated over a defined rolling period','Hard to game and easy to explain in a postmortem','Derived from real request, job, or CUJ data']},
 right:{title:'Avoid these as primary SLIs',bullets:['CPU or memory utilisation in isolation','Node or pod count','Pod restart rate (a symptom, not the pain)','Deployment frequency (a velocity metric)','Synthetic probes that don\'t reflect real traffic']},

 title:'The target comes first. The measurement proves whether you\'re meeting it.',

   {num:'01',label:'Decide',desc:'Agree on the failure threshold where users actually notice pain — before any data exists'},
   {num:'02',label:'Measure',desc:'Instrument good ÷ total continuously. This is the SLI — a live ratio against your committed target'},
   {num:'03',label:'Compare',desc:'Is the live SLI above or below the committed percentage? The gap is what matters'},
   {num:'04',label:'Act',desc:'If consuming budget faster than allowed, engineering behavior changes — now, not at month-end'}
 ],
 analogy:[
   {concept:'Speed limit',   val:'<b>The SLO</b> — a deliberate prior commitment (e.g. 99.9%)'},
   {concept:'Speedometer',   val:'<b>The SLI</b> — the live ratio of good ÷ total requests'},
   {concept:'Distance left', val:'<b>The error budget</b> — how far you can go before enforcement kicks in'},
   {concept:'No limit posted', val:'"67 mph" means nothing. Without a target, the ratio is just a number'}
 ],

   'With SLO: "We have 18% of error budget remaining — yes, we delay" — objective, pre-agreed, no debate',

{section:'SLO Math',type:'slomath',chart:'costcurve',
 title:'From percentage to budget: the arithmetic behind SLOs',
 notes:"Walk the worked example on the board, don't just read it — the arithmetic is simple but the first time through, people need to see it built step by step.",
 subtitle:'Every SLO percentage is a ratio. Understanding the arithmetic prevents the most common target-setting mistakes.',
 formula:'SLI  =  good_events  ÷  valid_events  ×  100',
 formulaNote:'Always a ratio — latency SLIs count "requests completing under threshold" as the good_event, not raw duration',
 steps:[
   {label:'SLO target',   eq:'99.9%  &rarr;  <b>0.999</b>  (as a decimal)'},
   {label:'Error budget', eq:'1 &minus; 0.999  =  <b>0.001</b>  &rarr;  0.1% of requests may fail'},
   {label:'Volume',       eq:'1 M req/day &times; 30 days  =  <b>30,000,000</b> total requests'},
   {label:'Allowed bad',  eq:'30,000,000 &times; 0.001  =  <b>30,000</b> failures permitted'},
   {label:'Breach check', eq:'35,000 failures &gt; 30,000  &rarr;  <b>SLO missed</b> by 5,000 requests (rate 0.117% vs. 0.1% allowed)'},
   {label:'Burn rate',    eq:'A live 1.44% error rate &divide; 0.1% budget  &rarr;  <b>14.4&times;</b> burn &mdash; exhausts in &asymp;50 h if sustained'}
 ],
 nines:[
   {slo:'99%',    downtime:'7.2 h / month',   bad:'300,000'},
   {slo:'99.5%',  downtime:'3.6 h / month',   bad:'150,000'},
   {slo:'99.9%',  downtime:'43.2 min / month', bad:'30,000',  hl:true},
   {slo:'99.95%', downtime:'21.6 min / month', bad:'15,000'},
   {slo:'99.99%', downtime:'4.32 min / month', bad:'3,000'}
 ],
 callout:'Choose your SLO based on the threshold where users actually notice pain — not on the prestige of the number. A 99.99% SLO with no enforcement mechanism is worse than a 99.9% SLO that drives real engineering decisions.',
 note:'Reference: Google SRE Workbook, Chapter 2 — Implementing SLOs (<a href="https://sre.google/workbook/implementing-slos/" target="_blank" rel="noreferrer">sre.google/workbook/implementing-slos</a>). The worked arithmetic above matches Google\'s internal model. Window choice: the Workbook recommends a <b>4-week rolling window</b> (28 days, spanning integral weeks so weekday/weekend traffic mix stays consistent) over a calendar month — calendar windows create a "budget resets on the 1st, ship everything" pathology near period boundaries.'},

 subtitle:'A composite SLO is a product distribution of its dependencies — every hard dependency you add multiplies your ceiling down, not up.',

 formulaNote:'Serial hard dependencies multiply. Two 99.9% dependencies in series cap you at 99.8% &mdash; not 99.9% &mdash; before you\'ve written a line of your own code.',

   {label:'Ceiling',         eq:'This is the <b>most</b> your architecture can deliver &mdash; before code, config, or ops risk'}
 ],

   {layer:'&times; Operations (deploys, patching, certs)', slo:'99.95%'},

{section:'Alerting',type:'burnrate',
 title:'Burn-rate alerting: see risk before the SLO is breached',
 notes:"This is the technical core of the deck — don't rush it. Make sure the two-window explanation lands before moving to the bar chart.",
 subtitle:'Alert on budget consumption rate, not raw error counts. The multiplier tells you how many times faster than sustainable you are burning.',
 formula:'burn_rate  =  error_rate  &divide;  (1 &minus; SLO_target)',
 formulaNote:'Dimensionless ratio. At 1&times; you exhaust the budget exactly at the window deadline &mdash; a guaranteed miss. At 14.4&times; you exhaust it in 1/14.4 of the window (&asymp;50 h of a 30-day budget). Same threshold works at any traffic volume because it is always relative to your SLO budget.',
 tiers:[
   {mult:'14.4&times;',name:'Page: Fast burn',windows:'1 h long &middot; 5 min short',cs:'r',
    impact:'2% of the 30-day budget gone in 1 h &mdash; exhausts in &asymp;50 h if sustained. Requires immediate human response.',
    example:'Example &rarr; 1.44% errors on 99.9% SLO: &nbsp; 1.44 &divide; 0.1 = 14.4&times;'},
   {mult:'6&times;',name:'Page: Mid burn',windows:'6 h long &middot; 30 min short',cs:'a',
    impact:'5% of the 30-day budget gone in 6 h &mdash; exhausts in 5 days if sustained. Requires human response.',
    example:'Example &rarr; 0.6% errors on 99.9% SLO: &nbsp; 0.6 &divide; 0.1 = 6&times;'},
   {mult:'1&times;',name:'Ticket: Slow burn',windows:'3 days long &middot; 6 h short',cs:'g',
    impact:'10% of the 30-day budget gone in 3 days &mdash; a slow, sustained drain. Actionable next business day.',
    example:'Example &rarr; 0.1% errors on 99.9% SLO: &nbsp; 0.1 &divide; 0.1 = 1&times;'}
 ],
 twoWindow:'The <b>long window is what detects</b> the burn &mdash; short enough to page fast, long enough to be statistically real. The <b>short window is a reset gate</b>, always 1/12 of the long window: both must still be above threshold for the alert to keep firing, so it clears within minutes of the error rate recovering instead of lingering for the rest of the long window. Example: a 1 h/5 min pair drops within 5 minutes of errors stopping &mdash; without the short window, the 1 h average would keep the page open for up to an hour after the fix landed.',
 callout:'Why not alert on raw error counts? 500 errors/hour at 500k req/h = 0.1% (fine). At 5k req/h = 10% (catastrophic). Burn rate is load-invariant: the same threshold works at any traffic volume, any time of day.',
 note:'Source: Google SRE Workbook, Ch. 5 &mdash; Alerting on SLOs, Table 5-8 (multi-window, multi-burn-rate alerting). <a href="https://sre.google/workbook/alerting-on-slos/" target="_blank" rel="noreferrer">sre.google/workbook/alerting-on-slos</a>'},


{section:'FMA & PRR',type:'twopane',
 title:'Two reviews that happen before the incident, not after',
 notes:"If your org doesn't have a PRR process, say so plainly and treat this as the proposal, not a description of the status quo.",
 subtitle:'Failure Mode Analysis finds the risks in the design. A Production Readiness Review decides whether SRE will carry the pager for it.',
 left:{title:'Failure Mode Analysis (FMA)',bullets:[
   'Decompose the critical flow into its individual steps and dependencies',
   'For each step, enumerate ways it can fail — not just "it fails," but how',
   'Rate each failure by detectability and business impact',
   'Assign a mitigation to every failure that is both likely and severe: redundancy, a timeout, a fallback, a circuit breaker',
   'Run FMA before launch and again after any major architecture change — dependencies drift'
 ]},
 right:{title:'Production Readiness Review (PRR)',bullets:[
   'A prerequisite gate: SRE does not take the pager for a service that has not passed one',
   'Reviews system design and dependencies, monitoring and instrumentation, capacity, config-change management, and incident response readiness',
   'Examines recent incidents and postmortems to size the real operational demand',
   'A service that fails its PRR stays with the development team until the gaps it names are closed',
   'This is the concrete answer to "how does SRE actually engage" — not a vibe, a checklist with a pass/fail outcome'
 ]},
 note:'Sources: Azure Well-Architected Framework, RE:03 — Failure Mode Analysis (<a href="https://learn.microsoft.com/en-us/azure/well-architected/reliability/failure-mode-analysis" target="_blank" rel="noreferrer">learn.microsoft.com/.../failure-mode-analysis</a>); Google SRE Book — Evolving SRE Engagement Model, Production Readiness Reviews (<a href="https://sre.google/sre-book/evolving-sre-engagement-model/" target="_blank" rel="noreferrer">sre.google/sre-book/evolving-sre-engagement-model</a>).'},

{section:'Progressive Delivery',type:'twopane',
 title:'Progressive delivery is the mechanism the error budget policy gates',
 notes:"Connect this explicitly back to Governance — this is the ship differently lever that a pure ship, slow, stop framing is missing.",
 subtitle:'"Slow down releases" is not a real lever unless there is a mechanism for shipping more safely, not just less often.',
 left:{title:'The release-safety ladder',bullets:[
   '<b>Canary:</b> shift a small percentage of traffic to the new version, hold it, then complete the rollout — e.g. 10% of traffic held for 10 minutes, then 100%',
   '<b>Linear:</b> shift traffic in equal increments on a fixed interval, re-checking health at each step',
   '<b>Blue/green:</b> stand up the new version fully alongside the old one; switch traffic over, keep the old environment idle for instant rollback',
   '<b>Automated rollback:</b> wire the rollout to the same alarms your SLO already watches — a breached error-rate alarm mid-rollout reverts traffic automatically, no human required',
   '<b>Feature flags:</b> decouple deploy from release — ship the code dark, flip it on for a cohort, kill it instantly without a redeploy',
   '<b>Expand/contract:</b> for schema changes, add the new field, migrate readers, then remove the old field in a later release — never a single breaking migration'
 ]},
 right:{title:'How this plugs into the budget policy',bullets:[
   'Budget healthy → ship with automated canary + rollback; no manual gate needed',
   'Budget degraded → require an SRE-reviewed canary with a longer bake time before full rollout',
   'Budget exhausted → feature flags let you keep shipping *code* while keeping risky paths *dark* — velocity does not have to fully stop',
   'DORA\'s five delivery metrics measure this ladder\'s health directly: change lead time, deployment frequency, change fail rate, deployment rework rate, and failed-deployment recovery time',
   'A rollback that requires a human to notice and act is a runbook waiting to be automated — see the Toil slide'
 ]},
 note:'Sources: AWS SAM Developer Guide — Deploying serverless applications gradually (canary/linear traffic shifting, alarm-triggered rollback), <a href="https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html" target="_blank" rel="noreferrer">docs.aws.amazon.com/.../automating-updates-to-serverless-apps</a>; DORA — <a href="https://dora.dev/guides/dora-metrics-four-keys/" target="_blank" rel="noreferrer">dora.dev/guides/dora-metrics-four-keys</a>.'},

{section:'Postmortem Culture',type:'twopane',
 title:'Blameless postmortems close the learning loop',
 notes:"Share a real, redacted postmortem from your org if you have one — this slide lands better with a concrete example than the bullet list alone.",
 subtitle:'Every SLO breach is an opportunity to update the system. Postmortems that assign blame fix nothing — they only hide future problems.',
 left:{title:'A good postmortem contains',bullets:['Precise impact statement: who, what, for how long','Detailed timeline from first signal to resolution','Root cause analysis (5-whys or fishbone)','Contributing factors beyond the immediate cause','Action items with owners and due dates']},
 right:{title:'Common anti-patterns',bullets:['Naming individuals rather than system failures','"Human error" as a root cause (it never is)','Action items with no owners or due dates','Writing the doc and never reviewing actions','Treating near-misses as non-events']},
 note:'At Google, postmortems are shared publicly across SRE teams. The willingness to share failure is the biggest cultural predictor of reliability improvement.'},

{section:'Toil',type:'toil',
 title:'Toil is the SRE enemy — name it, measure it, eliminate it',
 notes:"Ask for a show of hands on who spent more than half of last week on toil — this usually gets an uncomfortable, useful reaction.",
 subtitle:'From the SRE book: toil is work tied to running a production service that is manual, repetitive, automatable, tactical, and scales with service growth.',
 props:[
   {label:'Manual',desc:'Requires a human to execute rather than code to run automatically.'},
   {label:'Repetitive',desc:'Performed again and again with identical or near-identical steps.'},
   {label:'Automatable',desc:'A machine could do it — if someone invests time to build that machine.'},
   {label:'Tactical',desc:'Reactive interrupt work that prevents strategic engineering from happening.'},
   {label:'O(n) with scale',desc:'Grows linearly as traffic, tenants, or services grow — not absorbed by architecture.'},
   {label:'No enduring value',desc:'Leaves the system in the same state as before; adds no lasting improvement.'}
 ],
 callout:'The 50% rule: SREs should spend at most 50% of their time on toil. Consistently exceeding this is a signal to escalate and reallocate or automate.'},

{section:'Cascading Failures',type:'twopane',
 title:'Most SEV1s are not the original failure — they are the retry storm on top of it',
 notes:"The 64x number surprises people every time — let it sit for a second before moving to the mitigation bullets.",
 subtitle:'A cascading failure grows through positive feedback: a partial failure raises load on the survivors, which then fail too.',
 left:{title:'How retries turn a blip into an outage',bullets:[
   'Retries compound across layers: 3 retries at each of 3 stack layers (backend, frontend, client) is not 9 attempts — it\'s 3&sup3; = <b>27&times;</b>, and with the client itself included, 3&#8308; = <b>64 total attempts</b> for one user action',
   'A database already at capacity, hit with 64&times; the load from retries alone, cannot recover — the retries become the outage',
   'Always use <b>randomized exponential backoff</b> — synchronized retries without jitter create waves that self-amplify across every client',
   'Set a <b>retry budget</b> (e.g. 60 retries/minute/process) and a hard cap on retries per request — never retry indefinitely'
 ]},
 right:{title:'Shedding load on purpose beats failing by accident',bullets:[
   '<b>Load shedding:</b> deliberately drop a proportion of incoming traffic as the server approaches overload, so it keeps serving the requests it can handle',
   '<b>Graceful degradation:</b> serve a cheaper, lower-quality result instead of failing outright — cached-only results instead of a live database query',
   'Define the trigger metrics up front (CPU, latency, queue depth) and the exact degraded-mode action — deciding this during the incident is too late',
   'Implement shedding at the layer closest to the bottleneck — a global gate adds a new failure mode of its own',
   'This is the mechanism, not the theory, behind "budget exhausted → reduce change rate" on the Governance slide — it is also what you build *before* you need it'
 ]},
 note:'Source: Google SRE Book, Chapter 22 — Addressing Cascading Failures. <a href="https://sre.google/sre-book/addressing-cascading-failures/" target="_blank" rel="noreferrer">sre.google/sre-book/addressing-cascading-failures</a>'},

{section:'Multi-Tenant Resilience',type:'twopane',
 title:'Blast radius is an architecture decision, not an incident outcome',
 notes:"If your architecture is single-tenant or already cell-based, say so — this slide is most useful for teams who haven't yet decided their blast-radius strategy.",
 subtitle:'A shared-everything SaaS backend means one bad tenant, one bad shard, or one bad deploy can take down all tenants at once. It doesn\'t have to.',
 left:{title:'Static stability',bullets:[
   'AWS\'s definition: "the overall system keeps working even when a dependency becomes impaired"',
   'Control plane (create/modify/scale resources) is inherently more complex than data plane (serve the request) — and statistically more likely to fail',
   'Pre-provision capacity across zones/regions so failover does not depend on the control plane scaling anything up mid-incident',
   'A design that needs Auto Scaling or a config push to survive a failure is not statically stable — it has a dependency it hasn\'t priced in'
 ]},
 right:{title:'Cells and shuffle sharding',bullets:[
   '<b>Cell-based architecture:</b> partition tenants into independent cells; a bad deploy or bug in one cell cannot reach another — blast radius = 1/N of tenants, not 100%',
   '<b>Shuffle sharding:</b> assign each tenant a random combination of nodes instead of a fixed shard — with 8 nodes and 2 per tenant, traditional sharding gives 4 shards (1/4 of tenants share any failure); shuffle sharding gives <b>56</b> combinations (~1/56 blast radius); at 4 nodes per tenant, ~<b>1/1680</b>',
   'Two tenants sharing a shuffle shard fully overlap only when every one of their assigned nodes matches — vanishingly unlikely as shard size grows',
   'Pair with client-side retry logic: a request that hits a bad node in the shard retries onto a different one in the same tenant\'s shard'
 ]},
 note:'Sources: AWS Builders’ Library — Static Stability Using Availability Zones (<a href="https://aws.amazon.com/builders-library/static-stability-using-availability-zones/" target="_blank" rel="noreferrer">aws.amazon.com/builders-library/static-stability</a>); AWS Architecture Blog — Shuffle Sharding: Massive and Magical Fault Isolation (<a href="https://aws.amazon.com/blogs/architecture/shuffle-sharding-massive-and-magical-fault-isolation/" target="_blank" rel="noreferrer">aws.amazon.com/blogs/architecture/shuffle-sharding</a>).'},

{section:'EKS SaaS',type:'twopane',
 title:'Applying SRE to AWS EKS-hosted SaaS',
 notes:"Swap in your own platform's equivalent list if you're not on EKS — the customer-vs-platform SLI split is the transferable idea, not the specific AWS services.",
 subtitle:'Separate customer-facing SLOs from platform health signals. Platform metrics are supporting context, not user promises.',
 left:{title:'Customer SLIs (own these)',bullets:['API request success rate per tenant','Tenant workflow completion rate','Authentication success rate','p99 API latency per CUJ','Async job completion within SLA window','Data freshness for read-heavy surfaces']},
 right:{title:'Platform SLIs (support customer SLIs)',bullets:['Ingress / ALB routing success','Pod readiness across critical Deployments','Node availability per AZ','CoreDNS resolution latency','HPA responsiveness under burst load','EBS / EFS volume mount success rate']},
 note:'Platform SLIs are leading indicators for customer SLIs. Correlate them in dashboards, but publish customer SLOs to stakeholders — not node counts.'},

{section:'Observability',type:'columns',
 title:'Your observability stack must serve SLOs',
 notes:"Ask whether the team could answer the four questions in the callout right now, live, during an incident — that's the real test of the stack.",
 subtitle:'Metrics, logs, and traces are inputs to reliability decisions — not the objective itself.',
 cols:[
   {title:'Metrics',items:['Prometheus + recording rules for SLI ratios','Grafana SLO dashboards','CloudWatch Container Insights','Custom burn-rate alert rules']},
   {title:'Logs',items:['Structured JSON logs with correlation IDs','Request-level success/failure tagging','Fluent Bit → OpenSearch / S3','Per-tenant log aggregation']},
   {title:'Traces',items:['OpenTelemetry SDK instrumentation','AWS X-Ray or Jaeger on EKS','Latency attribution across service graph','Trace-based SLI validation']}
 ],
 callout:'The key question your observability stack must answer: what is failing, who is affected, how fast is the budget burning, and which service owns the problem?'},

{section:'Anti-patterns',type:'twopane',
 title:'What a Principal Engineer would push back on',
 notes:"Good slide to pause on and ask the room to self-identify which anti-pattern they're closest to committing.",
 subtitle:'The most common failure mode is metrics without governance. Dashboards without decisions are decoration.',
 left:{title:svgIcon('cross','var(--red)')+' Avoid',bullets:['Too many SLOs — alert fatigue and ignored dashboards','Ambiguous measurement boundaries (where does the SLI start?)','Infrastructure-only objectives that miss user impact','100% SLO targets that eliminate the error budget mechanism','Postmortems that blame individuals rather than systems','SREs spending &gt; 50% of time on toil']},
 right:{title:svgIcon('check','var(--green)')+' Prefer',bullets:['A small set of CUJ-driven SLOs that decision-makers trust','Clear event counting with a documented good/bad definition','A written error-budget policy signed off by product and engineering','Burn-rate alerts wired to on-call runbooks','Regular monthly SLO review meetings','Toil tracked as a metric alongside SLI data']},
 callout:'If a metric cannot drive a concrete engineering or product decision, it is probably not an SLO — it is a dashboard.'},

{section:'Incident Mgmt',type:'table',
 title:'Incident severity levels and response model',
 notes:"Confirm your own org's severity definitions match this table before presenting it as-is — severity definitions vary a lot between companies.",
 subtitle:'Shared severity definitions remove ambiguity during an incident and drive consistent escalation, communication, and post-incident action.',
 thead:['Severity','Definition','Response SLA','Communication cadence'],
 rows:[
   ['SEV1','Complete outage or data loss affecting all/most tenants','Page immediately — commander assigned within 5 min','External status page update every 15 min'],
   ['SEV2','Significant degradation — major CUJ failing for a subset of tenants','Page on-call — acknowledge within 15 min','Internal update every 30 min'],
   ['SEV3','Minor degradation — CUJ impaired but workaround exists','Ticket — respond within 2 hours','Tracked in incident channel; no external update'],
   ['SEV4','Cosmetic / low-impact issue with no user-visible SLO effect','Ticket — next business day','Linked to relevant Jira/Linear ticket']
 ],
 note:'Every SEV1/SEV2 requires an incident commander (IC). The IC owns communication and coordinates response — they do not fix the problem. Separate these roles explicitly in your runbook.'},

{section:'On-Call Health',type:'twopane',
 title:'Sustainable on-call is an SRE output metric',
 notes:"If you track any of these five metrics today, show the real numbers instead of the bullet list — this lands much harder with real data.",
 subtitle:'Alert fatigue and burnout are the #1 predictor of SRE attrition. Measure on-call health as rigorously as SLOs.',
 left:{title:'Healthy on-call signals',bullets:['≤ 2 actionable pages per shift on average','P50 time-to-resolve trending flat or down','Escalation rate < 10% of pages','Post-incident actions closed within agreed SLA','Rotation covers ≥ 4 engineers (no single-person coverage)']},
 right:{title:'Unhealthy on-call signals',bullets:['Noisy alerts that resolve without action (>20% of pages)','Same alert firing repeatedly without a fix or silence','Single engineer absorbing > 30% of incidents','Postmortem actions aging > 60 days with no progress','Engineers opting out of rotation due to burnout']},
 callout:'Track monthly: total pages, actionable rate, MTTR, and engineer-reported on-call burden score. If actionable page rate falls below 50%, the alerting policy needs work before the SLO does.'},

{section:'SLO Review',type:'twopane',
 title:'The monthly SLO review: what you actually do',
 notes:"Suggest scheduling the first review meeting before the end of this session — a slide about a meeting that never gets booked accomplishes nothing.",
 subtitle:'An SLO review is a decision meeting, not a dashboard walkthrough. Every agenda item should end with an action or a deliberate non-action.',
 left:{title:'Agenda (60 min)',bullets:['Review remaining error budget per SLO (10 min)','Walk SLO breach or near-miss events (15 min)','Review open postmortem actions — are they on track? (10 min)','Assess toil metric — is it trending down? (10 min)','Budget policy decision: ship / slow / stop (5 min)','SLO target review: tighten, loosen, or retire? (10 min)']},
 right:{title:'When to change an SLO target',bullets:['Tighten: customers are reporting pain inside the current target','Tighten: the team has consistently held 2× the target for 6+ months','Loosen: the target is never breached and the budget is never used','Loosen: the team is over-investing in reliability for this surface','Retire: the CUJ no longer exists or has been replaced','Add new: a new CUJ has launched and has no coverage']},
 note:'An SLO that has never been breached and has never triggered a policy action is either too loose or not being enforced. Both are problems.'},

{section:'Runbooks',type:'twopane',
 title:'What a good runbook looks like',
 notes:"Ask if anyone has tried following one of the team's own runbooks cold — most haven't, and that's the quarterly test this slide recommends.",
 subtitle:'A runbook is a playbook for a specific alert or failure mode. It must be actionable by a half-awake engineer at 3 AM.',
 left:{title:'Required sections',bullets:['Alert name and what it measures','Why it fires: threshold and burn-rate context','Likely causes (ordered by historical frequency)','Step-by-step triage: commands and expected output','Escalation: who to call and when','Rollback procedure if a deploy is involved','Link to the relevant SLO dashboard']},
 right:{title:'Runbook anti-patterns',bullets:['"Investigate the issue" as a step (not actionable)','Runbook last updated over 6 months ago','No expected output for diagnostic commands','Escalation contact is a team alias, not a named on-call','No rollback or mitigation path — only investigation','Requires access the on-call engineer may not have at 3 AM']},
 callout:'Test your runbooks. Once per quarter, have an engineer outside the team follow the runbook for a non-production incident. If they get stuck, update the runbook before the next real incident.'},

// helpers
function bl(items){return '<div class="blist">'+items.map(function(t){return'<div class="bitem"><div class="dot"></div><div>'+t+'</div></div>';}).join('')+'</div>';}
function cd(title,body){return'<div class="card"><div class="ctitle">'+title+'</div>'+body+'</div>';}
function ch(text,cs){return'<span class="chip '+(cs||'')+'">'+text+'</span>';}
function hd(s){return'<div class="kicker">'+s.section+'</div><h1 class="stitle">'+s.title+'</h1><p class="ssub">'+s.subtitle+'</p>';}
function co(t){return'<div class="callout">'+t+'</div>';}
function no(t){return'<div class="note">'+t+'</div>';}

function render(s){
  if(s.type==='hero'){
    return'<div class="hgrid">'+
      '<div class="card" style="padding:28px 32px;display:flex;flex-direction:column">'+
        '<div class="kicker">'+s.section+'</div>'+
        '<h1 class="stitle" style="font-size:clamp(1.75rem,3.2vw,2.9rem)">'+s.title+'</h1>'+
        '<p class="ssub" style="margin-bottom:16px">'+s.subtitle+'</p>'+
        '<div class="tags">'+s.tags.map(function(t,i){return ch(t,i>=2&&i<4?'r':'');}).join('')+'</div>'+
        '<div class="sdiv"></div>'+
        '<div style="flex:1;min-height:0;overflow:hidden;border-radius:8px;margin-top:4px">'+
          '<img src="images/Site-Reliability-Engineering-Guide.jpg" alt="Site Reliability Engineering guide cover" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block;border-radius:8px">'+
        '</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:13px">'+
        cd(s.left.title,bl(s.left.bullets))+
        cd(s.right.title,s.right.items.map(function(x){return'<div class="formula"><div class="fl">'+x.a+'</div><div class="fv">'+x.b+'</div></div>';}).join(''))+
      '</div>'+
    '</div>';
  }
  if(s.type==='columns'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g3">'+s.cols.map(function(c){return cd(c.title,bl(c.items));}).join('')+'</div>'+
      (s.callout?co(s.callout):'')+
    '</div>';
  }
  if(s.type==='cards'){
    var cls=s.cards.length>4?'g2':'g3';
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="'+cls+'">'+s.cards.map(function(c){
        return cd(c.name,'<div style="font-size:.88rem;line-height:1.58;margin-bottom:3px">'+c.desc+'</div>'+ch(c.chip,c.cs));
      }).join('')+'</div>'+
    '</div>';
  }
  if(s.type==='golden'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g4">'+s.signals.map(function(g){
        return'<div class="card">'+
          '<div class="sigicon" style="background:'+g.bg+';color:'+g.color+'">'+svgIcon(g.icon,g.color,20)+'</div>'+
          '<div class="sname" style="color:'+g.color+'">'+g.name+'</div>'+
          '<div class="sdesc">'+g.desc+'</div>'+
          '<span class="chip" style="border-color:'+g.color+';color:'+g.color+';background:'+g.bg+'">'+g.metric+'</span>'+
        '</div>';
      }).join('')+'</div>'+
      co(s.callout)+
    '</div>';
  }
  if(s.type==='table'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="twrap"><table class="tbl">'+
        '<thead><tr>'+s.thead.map(function(h){return'<th>'+h+'</th>';}).join('')+'</tr></thead>'+
        '<tbody>'+s.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody>'+
      '</table></div>'+
      no(s.note)+
    '</div>';
  }
  if(s.type==='metrics'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g3">'+s.items.map(function(m){
        return cd(m.top,'<div class="bignum">'+m.big+'</div><div style="font-size:.84rem;color:var(--muted)">'+m.desc+'</div>');
      }).join('')+'</div>'+
      (s.chart==='burndown'?cd('Error budget burn-down — 99.9% SLO, 30-day window','<div style="max-width:560px;margin:0 auto">'+chartBurndown()+'</div><div style="font-size:.78rem;color:var(--muted);margin-top:6px">Illustrative: a service burning at 2&times; its sustainable rate exhausts the entire 30-day budget by day 15 &mdash; this is exactly what a 2&times; burn-rate alert (see Alerting) is built to catch early.</div>'):'')+
      (s.footer?no(s.footer):'')+
    '</div>';
  }
  if(s.type==='loop'){
    var flowHtml=s.flow.map(function(st,i){
      var arr=i<s.flow.length-1?'<div class="loop-arr">&rarr;</div>':'';
      return'<div class="loop-step"><div class="loop-num">'+st.num+'</div><div class="loop-label">'+st.label+'</div><div class="loop-desc">'+st.desc+'</div></div>'+arr;
    }).join('');
    var analogyHtml=s.analogy.map(function(a){
      return'<div class="analogy-row"><div class="analogy-concept">'+a.concept+'</div><div class="analogy-val">'+a.val+'</div></div>';
    }).join('');
    return'<div style="display:flex;flex-direction:column;gap:16px">'+hd(s)+
      '<div class="loop-flow">'+flowHtml+'</div>'+
      '<div class="g2">'+
        cd('The speedometer analogy','<div style="padding:2px 0">'+analogyHtml+'</div>')+
        cd(s.right.title,bl(s.right.bullets))+
      '</div>'+
      (s.callout?co(s.callout):'')+
      (s.note?no(s.note):'')+
    '</div>';
  }
  if(s.type==='burnrate'){
    var tiersHtml=s.tiers.map(function(t){
      return'<div class="br-tier '+t.cs+'">'+
        '<div class="br-head"><span class="br-mult '+t.cs+'">'+t.mult+'</span><span class="br-name">'+t.name+'</span></div>'+
        '<div class="br-meta">Windows: '+t.windows+'</div>'+
        '<div class="br-body"><b>'+t.impact+'</b></div>'+
        '<div class="br-example">'+t.example+'</div>'+
      '</div>';
    }).join('');
    return'<div style="display:flex;flex-direction:column;gap:16px">'+hd(s)+
      '<div class="fmla-hero">'+
        '<div class="fmla-eq">'+s.formula+'</div>'+
        '<div class="fmla-sub">'+s.formulaNote+'</div>'+
      '</div>'+
      '<div class="g2">'+
        cd('Alert tiers',tiersHtml)+
        cd('Time to exhaustion &mdash; 30-day window, 99.9% SLO',
          chartExhaustionBars()+
          '<div style="margin-top:13px;padding:11px 13px;background:rgba(29,78,216,0.05);border-radius:8px;border:1px solid var(--blue-border)">'+
            '<div style="font-weight:800;font-size:.85rem;margin-bottom:4px">Two-window AND rule</div>'+
            '<div style="font-size:.82rem;color:var(--muted);line-height:1.55">'+s.twoWindow+'</div>'+
          '</div>')+
      '</div>'+
      co(s.callout)+
      (s.note?no(s.note):'')+
    '</div>';
  }
  if(s.type==='slomath'){
    var steps=s.steps.map(function(st){
      return'<tr><td class="slbl">'+st.label+'</td><td class="seq">'+st.eq+'</td></tr>';
    }).join('');
    var nineshead=s.nineshead||['SLO','Downtime / month','Allowed failures / 30 M req'];
    var nrows=s.nines.map(function(n){
      var cells=Object.keys(n).filter(function(k){return k!=='hl';}).map(function(k){return'<td>'+n[k]+'</td>';}).join('');
      return'<tr'+(n.hl?' class="nhl"':'')+'>'+cells+'</tr>';
    }).join('');
    return'<div style="display:flex;flex-direction:column;gap:16px">'+hd(s)+
      '<div class="fmla-hero">'+
        '<div class="fmla-eq">'+s.formula+'</div>'+
        '<div class="fmla-sub">'+s.formulaNote+'</div>'+
      '</div>'+
      '<div class="g2">'+
        cd(s.stepsTitle||'Worked example &mdash; 99.9% SLO, 30-day window','<table class="step-tbl">'+steps+'</table>')+
        cd(s.tableTitle||'What each additional nine actually costs',
          '<div class="twrap"><table class="nines-tbl">'+
            '<thead><tr>'+nineshead.map(function(h){return'<th>'+h+'</th>';}).join('')+'</tr></thead>'+
            '<tbody>'+nrows+'</tbody>'+
          '</table></div>')+
      '</div>'+
      (s.chart==='costcurve'?cd('The cost of a nine &mdash; illustrative, not measured','<div style="max-width:520px;margin:0 auto">'+chartCostCurve()+'</div><div style="font-size:.78rem;color:var(--muted);margin-top:6px">Google SRE Book, Embracing Risk: "cost does not increase linearly as reliability increments &mdash; an incremental improvement in reliability may cost 100&times; more than the previous increment." Bar heights above are illustrative, not measured data — the shape, not the exact multiple, is the point.</div>'):'')+
      (s.callout?co(s.callout):'')+
      (s.note?no(s.note):'')+
    '</div>';
  }
  if(s.type==='threepane'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g3">'+s.cols.map(function(c){return cd(c.title,bl(c.items));}).join('')+'</div>'+
      (s.callout?co(s.callout):'')+
      (s.note?no(s.note):'')+
    '</div>';
  }
  if(s.type==='twopane'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g2">'+cd(s.left.title,bl(s.left.bullets))+cd(s.right.title,bl(s.right.bullets))+'</div>'+
      (s.callout?co(s.callout):'')+
      (s.note?no(s.note):'')+
      (s.footer?'<div style="font-size:.84rem;color:var(--muted);line-height:1.6">'+s.footer+'</div>':'')+
    '</div>';
  }
  if(s.type==='toil'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div class="g2">'+s.props.map(function(p){
        return'<div class="tprop"><div class="rdot"></div><div><div class="tlabel">'+p.label+'</div><div class="tdesc">'+p.desc+'</div></div></div>';
      }).join('')+'</div>'+
      co(s.callout)+
    '</div>';
  }
  if(s.type==='links'){
    return'<div style="display:flex;flex-direction:column;gap:20px">'+hd(s)+
      '<div>'+s.links.map(function(l){
        return'<a class="reflink" href="'+l.url+'" target="_blank" rel="noreferrer">'+
          '<div><div class="rtitle">'+l.label+'</div><div class="rurl">'+l.url+'</div></div>'+
          ch('Open →')+
        '</a>';
      }).join('')+'</div>'+
      (s.footer?no(s.footer):'')+
    '</div>';
  }
  return hd(s);
}

// state
var idx=0;
function go(n){
  idx=Math.max(0,Math.min(n,SLIDES.length-1));
  if(history.replaceState)history.replaceState(null,'','#'+(idx+1));
  draw();
}
window.addEventListener('hashchange',function(){
  var h=parseInt(location.hash.slice(1),10);
  if(h>=1&&h<=SLIDES.length&&h-1!==idx)go(h-1);
});
// auto-fit dense slide content to the panel height instead of letting it scroll
function fitSlide(){
  if(window.innerWidth<=1080)return; // mobile layout scrolls naturally, skip scaling
  var panel=document.getElementById('panel');
  var content=document.getElementById('pcontent');
  if(!panel||!content)return;
  content.style.width='';
  content.style.transform='';
  var cs=getComputedStyle(panel);
  var avail=panel.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  var needed=content.scrollHeight;
  if(needed>avail&&needed>0){
    var scale=Math.max(0.55,avail/needed);
    content.style.transformOrigin='top left';
    content.style.width=(100/scale)+'%';
    content.style.transform='scale('+scale+')';
  }
}
window.addEventListener('resize',fitSlide);
function draw(){
  var s=SLIDES[idx],total=SLIDES.length;
  // nav list
  var nl=document.getElementById('navlist');
  nl.innerHTML=SLIDES.map(function(sl,i){
    return'<div class="ni'+(i===idx?' on':'')+'" data-i="'+i+'">'+
      '<div class="ns">'+String(i+1).padStart(2,'0')+' · '+sl.section+'</div>'+
      '<div class="nt">'+sl.title+'</div>'+
    '</div>';
  }).join('');
  nl.querySelectorAll('.ni').forEach(function(el){
    el.addEventListener('click',function(){
      go(+el.dataset.i);
      document.getElementById('app').classList.remove('mobilenav-open');
    });
  });
  var active=nl.querySelector('.ni.on');
  if(active)active.scrollIntoView({block:'nearest'});
  // topbar
  document.getElementById('schip').textContent=s.section;
  document.getElementById('scount').textContent=(idx+1)+' / '+total;
  document.getElementById('progbar').style.width=((idx+1)/total*100)+'%';
  // slide (with fade)
  var panel=document.getElementById('panel');
  panel.classList.add('fade-out');
  setTimeout(function(){
    panel.innerHTML='<div id="pcontent">'+render(s)+'</div>';
    panel.classList.remove('fade-out');
    fitSlide();
  },100);
  document.getElementById('bprev').disabled=idx===0;
  document.getElementById('bnext').disabled=idx===total-1;
  // scroll to top
  document.getElementById('frame').scrollTop=0;
  // speaker notes
  document.getElementById('notesContent').textContent=s.notes||'(No notes for this slide.)';
}
document.getElementById('bprev').onclick=function(){if(idx>0)go(idx-1);};
document.getElementById('bnext').onclick=function(){if(idx<SLIDES.length-1)go(idx+1);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();if(idx<SLIDES.length-1)go(idx+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(idx>0)go(idx-1);}
  if(e.key==='f'||e.key==='F'){toggleFullscreen();}
  if(e.key==='n'||e.key==='N'){
    var nd=document.getElementById('notesDrawer');
    nd.hidden=!nd.hidden;
  }
});
// sidebar toggle — desktop collapses the rail, mobile opens a full-screen drawer
document.getElementById('sidebartoggle').onclick=function(){
  var app=document.getElementById('app');
  if(window.innerWidth<=1080)app.classList.toggle('mobilenav-open');
  else app.classList.toggle('collapsed');
};
// fullscreen
function toggleFullscreen(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen();}
  else{document.exitFullscreen();}
}
document.getElementById('fsbtn').onclick=toggleFullscreen;
// print the whole deck, not just the current slide
window.addEventListener('beforeprint',function(){
  document.getElementById('printAll').innerHTML=SLIDES.map(function(s){
    return'<div class="panel-print">'+render(s)+'</div>';
  }).join('');
});
window.addEventListener('afterprint',function(){
  document.getElementById('printAll').innerHTML='';
});
// dark mode toggle
var darkStored=localStorage.getItem('dark');
var dark=darkStored!==null?darkStored==='1':matchMedia('(prefers-color-scheme: dark)').matches;
function applyDark(){
  document.body.classList.toggle('dark',dark);
  document.getElementById('dmlabel').textContent=dark?'DARK':'LIGHT';
  document.getElementById('dmthumb').textContent=dark?'🌙':'☀️';
}
applyDark();
document.getElementById('dmtoggle').addEventListener('click',function(){
  dark=!dark;
  localStorage.setItem('dark',dark?'1':'0');
  applyDark();
});
draw();
</script>
</body>
